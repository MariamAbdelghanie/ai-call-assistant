name: ai_call_assistant
description: Yapay zeka cagri asistani icin mobil panel.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.0
  # Uygulama icinden asistani aramak icin (LiveKit WebRTC).
  # Surumler ilk kurulumda cozulur; calisan surumu `flutter pub deps` ile sabitleyebilirsiniz.
  livekit_client: any
  permission_handler: any
  # Gorusme sirasinda ekranin uyumasini engeller (baglanti kopmasin).
  wakelock_plus: any
  # Arayuz yazi tipi (Outfit). Ilk acilista indirilir ve cihazda onbelleklenir.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
