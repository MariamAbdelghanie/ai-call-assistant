name: Agent brain tests

on:
  pull_request:
  push:
    branches:
      - main
      - "rabia/**"

permissions:
  contents: read

jobs:
  test:
    name: Python unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: python -m py_compile config_validation.py agent_brain/*.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
