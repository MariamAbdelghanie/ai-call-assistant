name: Agent brain tests

on:
  pull_request:
  push:
    branches:
      - main
      - "rabia/**"

permissions:
  contents: read

jobs:
  test:
    name: Python unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install backend test dependencies
        run: >
          python -m pip install
          "aiohttp>=3.9.0"
          "python-dotenv>=1.0.0"
          "requests>=2.32.0"
          certifi
          "livekit-api>=1.2.2"

      - name: Check Python syntax
        run: python -m py_compile agent.py call_simulator.py config_validation.py agent_brain/*.py backend/*.py services.py web_dialer.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
